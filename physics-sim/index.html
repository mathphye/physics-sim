<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Sim - Foundations</title>
    <meta name="description" content="A solid foundation for an interactive physics simulator using HTML5 Canvas.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Physics<span>Sim</span></h1>
            <p>Particle Laboratory</p>
        </header>

        <main>
            <canvas id="canvas"></canvas>
            
            <div id="controls" class="glass">
                <div class="tabs">
                    <button class="tab-btn active" data-mode="kinetics">Kinetics</button>
                    <button class="tab-btn" data-mode="dynamics">Dynamics</button>
                </div>

                <div id="kinetics-controls" class="control-group">
                    <h3>Motion Parameters</h3>
                    <div class="input-wrap">
                        <label>Velocity X</label>
                        <input type="range" id="vel-x" min="-10" max="10" value="0" step="0.1">
                        <span class="val-display" id="val-vx">0</span>
                    </div>
                    <div class="input-wrap">
                        <label>Velocity Y</label>
                        <input type="range" id="vel-y" min="-10" max="10" value="0" step="0.1">
                        <span class="val-display" id="val-vy">0</span>
                    </div>
                </div>

                <div id="dynamics-controls" class="control-group hidden">
                    <h3>Physical Properties</h3>
                    <div class="input-wrap">
                        <label>Mass (kg)</label>
                        <input type="range" id="mass" min="1" max="50" value="10">
                        <span class="val-display" id="val-mass">10</span>
                    </div>
                    <div class="input-wrap">
                        <label>Gravity</label>
                        <input type="range" id="gravity" min="0" max="2" value="0.5" step="0.05">
                        <span class="val-display" id="val-gravity">0.5</span>
                    </div>
                    <div class="btn-group">
                        <button id="apply-force">Apply Impulse</button>
                    </div>
                </div>

                <div class="info-box">
                    <p id="mode-desc">Kinetics: Describing motion through position and velocity.</p>
                </div>

                <button id="reset-btn">Reset Simulation</button>
            </div>

            <div id="ui-overlay" class="glass">
                <div class="stat">
                    <span class="label">Position:</span>
                    <span id="pos-display" class="value">0, 0</span>
                </div>
                <div class="stat">
                    <span class="label">Velocity:</span>
                    <span id="vel-display" class="value">0.0 m/s</span>
                </div>
            </div>
        </main>

        <footer class="glass">
            <p>V1.0 - Alpha Foundation</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
